name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Verify plugin.json version matches tag
        run: |
          plugin_version=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          tag_version="${{ steps.version.outputs.version }}"
          if [ "$plugin_version" != "$tag_version" ]; then
            echo "Version mismatch: .claude-plugin/plugin.json=$plugin_version tag=$tag_version"
            exit 1
          fi
          echo "Version: $tag_version"

      - name: Generate release notes
        id: notes
        run: |
          cat <<'EOF' > notes.md
          ## Install

          ```
          claude plugin marketplace add livedge/apiregen
          claude plugin install apiregen
          ```

          ## What's included

          ### Slash commands
          | Command | Description |
          |---------|-------------|
          | `/capture` | Guide through capturing web traffic as HAR files |
          | `/recon` | Phase 1 — analyze traffic, build Page Context Document, auto-dispatch specialists |
          | `/mapping` | Phase 2 — cross-session differential analysis |
          | `/report` | Phase 3 — full API Intelligence Report |
          | `/model` | Build clustered API model, coverage, OpenAPI, AsyncAPI, replay commands |
          | `/schema` | Infer JSON response schema for specific endpoints |
          | `/typegen` | Phase 4 — generate typed classes via QuickType |
          | `/investigate` | Ad-hoc deep-dive into specific endpoints |

          ### Specialist agents (auto-triggered by `/recon`)
          - `rest-api-specialist` — REST endpoints, pagination, auth, OpenAPI specs
          - `graphql-specialist` — GraphQL operations, fragments, schemas, hidden mutations/subscriptions
          - `websocket-specialist` — graphql-ws, socket.io, SignalR, STOMP, MQTT, binary frames
          - `binary-decoder-specialist` — probes opaque payloads against base64/gzip/brotli/zstd/MessagePack/CBOR/Protobuf/BSON, peels layered encodings, validates the decode

          ### MCP server
          - `apiregen-har` — 26 tools for loading, searching, filtering, modeling, and analyzing HAR traffic, plus OpenAPI/AsyncAPI and QuickType-based type generation
          - 8 specialist agents covering REST, GraphQL, WebSocket, binary codecs, gRPC-family transports, realtime frameworks, RPC-style transports, and native mobile transport stacks

          ### CLI
          - `apiregen start` — guided interactive workflow
          - `apiregen init` — initialize `.apiregen/` project
          - `apiregen capture` — capture traffic (Camoufox browser or mitmproxy)
          - `apiregen flows-to-har` — convert mitmproxy flows to HAR
          - `apiregen extract-source` — pull HTML/JS from HAR
          - `apiregen model` — generate clustered API model
          - `apiregen openapi` — generate OpenAPI 3.1 JSON
          - `apiregen asyncapi` — generate AsyncAPI 3.0 JSON
          - `apiregen replay` — generate redacted curl commands
          - `apiregen recon` — raw traffic summary
          - `apiregen mcp` — run MCP server standalone
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: true
